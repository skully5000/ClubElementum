name: Build Served Posters

on:
  push:
    branches: [main]
    paths:
      - 'Posters/originals/**'
  workflow_dispatch:

env:
  POOL_SIZE: 80                 # must match poolSize on DancerPoster in Unity
  SRC_DIR: Posters/originals
  OUT_DIR: Posters/served

jobs:
  build-posters:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ImageMagick is installed
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Rebuild served posters
        run: |
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          mapfile -d '' files < <(
            find "$SRC_DIR" -maxdepth 1 -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) \
              -print0 | sort -z
          )

          total=${#files[@]}
          if [ "$total" -gt "$POOL_SIZE" ]; then
            echo "::warning::$total posters found but pool size is $POOL_SIZE; only the first $POOL_SIZE will be served."
          fi

          i=0
          for src in "${files[@]}"; do
            if [ "$i" -ge "$POOL_SIZE" ]; then break; fi
            i=$((i + 1))
            # Fit within 2048x2048 (VRChat image loader limit), keeping aspect ratio; only shrink.
            convert "$src" -resize '2048x2048>' -strip "$OUT_DIR/poster$i.png"
            echo "poster$i.png <- $(basename "$src") ($(identify -format '%wx%h' "$OUT_DIR/poster$i.png"))"
          done

          printf '%s' "$i" > "$OUT_DIR/count.txt"
          echo "Served $i poster(s)."

      - name: Commit served posters if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "No changes to served posters, skipping commit."
          else
            git commit -m "chore: rebuild served posters"
            git push
          fi
