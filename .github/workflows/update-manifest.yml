name: Update Dancer Manifest

on:
  push:
    branches: [main]
    paths:
      - 'Posters/Dancers/**'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.txt
        run: |
          ls Posters/Dancers/ \
            | grep -iE '\.(png|jpg|jpeg|webp)$' \
            | sort \
            > Posters/Dancers/manifest.txt

      - name: Commit manifest if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Posters/Dancers/manifest.txt
          if git diff --cached --quiet; then
            echo "No changes to manifest, skipping commit."
          else
            git commit -m "chore: auto-update dancer manifest"
            git push
          fi
