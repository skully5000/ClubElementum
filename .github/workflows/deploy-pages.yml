name: Deploy Pages

# Pages source must be set to "GitHub Actions" (Settings -> Pages -> Build and deployment).
# Branch-based Pages deploys fail for commits pushed by github-actions[bot], so this
# workflow deploys on normal pushes AND after Build Served Posters commits new posters.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build Served Posters"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, including the bot's served-posters commit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
